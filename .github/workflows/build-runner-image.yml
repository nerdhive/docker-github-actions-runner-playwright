name: Build Runner Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.runner
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - .github/workflows/build-runner-image.yml
  schedule:
    # Weekly rebuild to pick up Ubuntu noble security/package updates for the
    # apt-installed OS deps (ca-certificates, curl, ffmpeg, xz-utils) baked
    # into Dockerfile.runner. Those packages have no version pin Renovate can
    # track, so a scheduled rebuild — with CACHEBUST busting the apt layer's
    # cache below — is what keeps them current instead of frozen at whatever
    # was latest the last time someone touched the Dockerfile.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.event.repository.name }}-github-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ubuntu-noble-playwright
            type=sha,format=short,prefix=sha-

      - name: Build and push runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHEBUST=${{ github.event_name == 'schedule' && github.run_id || '0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
